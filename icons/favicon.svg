<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  <!-- Fuel Drop Body -->
  <path d="M50 15 C50 15 28 42 28 58 C28 71 38 82 50 82 C62 82 72 71 72 58 C72 42 50 15 50 15Z"
        fill="url(#dropGrad)" filter="url(#glow)"/>
  <!-- Speedometer arc (white) -->
  <path d="M36 62 Q50 44 64 62" stroke="white" stroke-width="3.5" fill="none"
        stroke-linecap="round" opacity="0.95"/>
  <!-- Needle -->
  <line x1="50" y1="62" x2="42" y2="50" stroke="white" stroke-width="2.5"
        stroke-linecap="round" opacity="0.95"/>
  <!-- Center dot -->
  <circle cx="50" cy="62" r="3" fill="white" opacity="0.95"/>
  <!-- Analytics spark (green) -->
  <polygon points="41,46 44,52 40,52 43,58" fill="#22c55e" filter="url(#glow)"/>
</svg>
