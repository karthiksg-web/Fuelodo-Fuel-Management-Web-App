<body>

  <div class="auth-theme-toggle">
    <button class="theme-toggle btn-icon" id="themeToggle" aria-label="Toggle theme">🌙</button>

  <div class="auth-page">
    <!-- Floating Particles -->

    <div class="auth-container">
      <div class="auth-glow">
        <div class="auth-card">
          <!-- Logo -->
          <div class="auth-logo">
            <div class="logo-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="56" height="56" aria-hidden="true">
                <defs>
                  <linearGradient id="authDropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#6366f1" />
                    <stop offset="100%" style="stop-color:#4338ca" />
                  </linearGradient>
                  <linearGradient id="authBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#0f172a" />
                    <stop offset="100%" style="stop-color:#1e1b4b" />
                  </linearGradient>
                  <filter id="authGlow">
                    <feGaussianBlur stdDeviation="2" result="coloredBlur" />
                    <feMerge>
                      <feMergeNode in="coloredBlur" />
                      <feMergeNode in="SourceGraphic" />
                    </feMerge>
                  </filter>
                </defs>
                <rect width="100" height="100" rx="22" fill="url(#authBgGrad)" />
                <path d="M50 15 C50 15 28 42 28 58 C28 71 38 82 50 82 C62 82 72 71 72 58 C72 42 50 15 50 15Z"

                <path d="M36 62 Q50 44 64 62" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round"
                  opacity="0.95" />
                <line x1="50" y1="62" x2="42" y2="50" stroke="white" stroke-width="2.5" stroke-linecap="round"
                  opacity="0.95" />
                <circle cx="50" cy="62" r="3" fill="white" opacity="0.95" />
                <polygon points="41,46 44,52 40,52 43,58" fill="#22c55e" filter="url(#authGlow)" />
              </svg>
            </div>
            <h1>FuelOdo</h1>
            <p>By Karthik Sulakhe &nbsp;·&nbsp; Smart Fuel &amp; Expense Tracker</p>
          </div>

          <!-- Login / Register Toggle -->
          <div class="auth-tabs" id="authTabs">
            <button class="auth-tab active" data-tab="login">Sign In</button>
            <button class="auth-tab" data-tab="register">Register</button>
          </div>

          <!-- Login Form -->
          <div class="auth-step active" id="stepLogin">
            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" class="form-input" id="loginEmail" placeholder="you@example.com" autocomplete="email">
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password"
                autocomplete="current-password">
            </div>
            <button class="btn btn-primary auth-btn btn-lg" id="loginBtn">
              Sign In
            </button>
            <div class="forgot-link">
              <button id="forgotPasswordBtn">Forgot password?</button>
            </div>
          </div>

          <!-- Register Form -->
          <div class="auth-step" id="stepRegister">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-input" id="registerName" placeholder="Enter your name" autocomplete="name">
            </div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" class="form-input" id="registerEmail" placeholder="you@example.com"
                autocomplete="email">
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="password" class="form-input" id="registerPassword" placeholder="Min 6 characters"
                autocomplete="new-password">
            </div>
            <button class="btn btn-primary auth-btn btn-lg" id="registerBtn">
              Create Account
            </button>
          </div>

          <!-- Divider -->
          <div class="auth-divider">
            <span>or continue with</span>
          </div>

          <!-- Google Sign In -->
          <button class="btn btn-google auth-btn" id="googleSignInBtn">
            <svg width="20" height="20" viewBox="0 0 48 48">
              <path fill="#FFC107"
                d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z" />
